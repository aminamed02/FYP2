<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HV Insulator Monitor - Remote Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #00b894;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h3 {
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        .current-value {
            font-size: 72px;
            font-weight: bold;
            color: #00b894;
        }
        
        .current-unit {
            font-size: 24px;
            margin-left: 5px;
        }
        
        .status-value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status-safe { color: #00b894; }
        .status-warning { color: #fdcb6e; }
        .status-critical { color: #e17055; }
        
        .gauge-container {
            position: relative;
            width: 200px;
            height: 100px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        .gauge {
            position: relative;
            width: 200px;
            height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 100px 100px 0 0;
            overflow: hidden;
        }
        
        .gauge-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, #00b894, #fdcb6e, #e17055);
            transition: height 0.5s ease;
            border-radius: 100px 100px 0 0;
        }
        
        .gauge-value {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .info-label {
            color: #aaa;
        }
        
        .info-value {
            font-weight: bold;
        }
        
        .online {
            color: #00b894;
        }
        
        .offline {
            color: #e17055;
        }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 30px;
        }
        
        button {
            background: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #019874;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @media (max-width: 768px) {
            .current-value { font-size: 48px; }
            .status-value { font-size: 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 HV Insulator Monitor</h1>
        <div class="subtitle">Real-time Leakage Current Monitoring</div>
        
        <div class="dashboard">
            <div class="card">
                <h3>📊 Leakage Current</h3>
                <div class="current-value">
                    <span id="current">--</span><span class="current-unit">mA</span>
                </div>
            </div>
            
            <div class="card">
                <h3>⚡ System Status</h3>
                <div class="status-value" id="status">--</div>
            </div>
            
            <div class="card">
                <h3>📈 Current Level</h3>
                <div class="gauge-container">
                    <div class="gauge">
                        <div class="gauge-fill" id="gaugeFill"></div>
                    </div>
                    <div class="gauge-value" id="gaugeValue">0%</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h3>ℹ️ System Information</h3>
            <div class="info-row">
                <span class="info-label">🟢 Device Status:</span>
                <span class="info-value" id="deviceStatus">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">⏱️ Last Reading:</span>
                <span class="info-value" id="timestamp">--</span>
            </div>
            <div class="info-row">
                <span class="info-label">📡 Data Source:</span>
                <span class="info-value">Sinric Pro API</span>
            </div>
        </div>
        
        <div style="text-align: center;">
            <button onclick="fetchData()">🔄 Refresh Now</button>
        </div>
        
        <div class="last-update" id="lastUpdate">
            Auto-refreshing every 10 seconds...
        </div>
    </div>

    <script>
        // ========================================================
        // REPLACE THESE WITH YOUR ACTUAL VALUES
        // ========================================================
        const API_KEY = "4a9dab51-d205-4df1-b9ba-3ec70d8f92be";      // From Sinric Pro Portal → Credentials
        const DEVICE_ID = "6a02d8e6c93c9fd0e0f10a19";  // From your HV Insulator device page
        // ========================================================

        let currentValue = 0;
        let isOnline = false;

        async function fetchData() {
            try {
                // Show loading indicator
                document.getElementById('current').innerHTML = '...';
                document.getElementById('deviceStatus').innerHTML = '<span class="pulse">Connecting...</span>';
                
                // Make API request to Sinric Pro
                const response = await fetch(`https://api.sinric.pro/api/v1/devices/${DEVICE_ID}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log("API Response:", data);
                
                // Extract temperature value (leakage current in mA)
                // Adjust this based on your device's actual data structure
                if (data && data.device) {
                    // For Temperature Sensor device type
                    currentValue = data.device.temperature || 0;
                    isOnline = data.device.connected === true;
                } else if (data && data.temperature) {
                    currentValue = data.temperature;
                } else {
                    // Fallback - try to find the value
                    currentValue = data.currentValue || data.value || 0;
                }
                
                // Update display
                updateDisplay(currentValue, isOnline);
                
                // Update timestamp
                const now = new Date();
                document.getElementById('timestamp').innerHTML = now.toLocaleString();
                document.getElementById('lastUpdate').innerHTML = `Last updated: ${now.toLocaleTimeString()} | Auto-refreshing every 10 seconds`;
                
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('current').innerHTML = 'Error';
                document.getElementById('status').innerHTML = '⚠️ Connection Error';
                document.getElementById('deviceStatus').innerHTML = '<span class="offline">Offline / Error</span>';
                document.getElementById('lastUpdate').innerHTML = `Error: ${error.message} | Check API key and device ID`;
            }
        }
        
        function updateDisplay(value, online) {
            // Format current value
            const formattedValue = typeof value === 'number' ? value.toFixed(2) : parseFloat(value).toFixed(2);
            document.getElementById('current').innerHTML = formattedValue;
            
            // Determine status based on thresholds
            let status = "SAFE";
            let statusClass = "status-safe";
            
            if (value >= 60) {
                status = "CRITICAL - FLASHOVER";
                statusClass = "status-critical";
            } else if (value >= 20) {
                status = "WARNING - ARCING";
                statusClass = "status-warning";
            } else {
                status = "SAFE";
                statusClass = "status-safe";
            }
            
            const statusElement = document.getElementById('status');
            statusElement.innerHTML = status;
            statusElement.className = `status-value ${statusClass}`;
            
            // Update gauge (0-100 mA range)
            let percentage = Math.min(100, Math.max(0, (value / 100) * 100));
            document.getElementById('gaugeFill').style.height = `${percentage}%`;
            document.getElementById('gaugeValue').innerHTML = `${Math.round(percentage)}%`;
            
            // Update device status
            const deviceStatusElement = document.getElementById('deviceStatus');
            if (online) {
                deviceStatusElement.innerHTML = '<span class="online">● Online</span>';
            } else {
                deviceStatusElement.innerHTML = '<span class="offline">○ Offline</span>';
            }
        }
        
        // Initial load
        fetchData();
        
        // Auto-refresh every 10 seconds
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
